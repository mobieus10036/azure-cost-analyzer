name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Check for secrets
        run: |
          # Check for hardcoded credential values: key=<non-placeholder value>
          # Matches patterns like AZURE_SUBSCRIPTION_ID=abc123... or PASSWORD="secret"
          # Excludes: process.env references, placeholder/example values, error messages,
          #           template literals writing env var names, and comments
          if grep -rE "(AZURE_SUBSCRIPTION_ID|AZURE_TENANT_ID|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|API_KEY|PASSWORD)\s*[=:]\s*['\"]?[a-zA-Z0-9+/\-]{12,}" \
               --include="*.ts" --include="*.js" --include="*.json" src/ config/ 2>/dev/null \
             | grep -v "process\.env" \
             | grep -v "\.example" \
             | grep -v "your_" \
             | grep -v "placeholder"; then
            echo "Potential hardcoded secrets found in source code!"
            exit 1
          fi
          echo "No hardcoded secrets detected"
